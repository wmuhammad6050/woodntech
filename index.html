<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoodnTech - Pro Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f6f6f6;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    background:#111;
    color:white;
    position:sticky;
    top:0;
}

.logo{
    color:#d8b27c;
    font-weight:700;
}

.cart-btn{
    cursor:pointer;
    background:#d8b27c;
    padding:8px 12px;
    border-radius:5px;
    font-weight:600;
}

/* HERO */
.hero{
    height:80vh;
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85');
    background-size:cover;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero h1{font-size:60px;margin:0;}

/* PRODUCTS */
.products{
    padding:50px 8%;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.btn{
    background:#d8b27c;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    font-weight:600;
    border-radius:5px;
}

/* CART */
.cart{
    position:fixed;
    right:0;
    top:0;
    width:300px;
    height:100%;
    background:white;
    box-shadow:-5px 0 15px rgba(0,0,0,0.2);
    padding:20px;
    display:none;
    overflow:auto;
}

.cart h2{margin-top:0;}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.remove{
    color:red;
    cursor:pointer;
}

/* CONTACT */
.contact{
    background:white;
    padding:50px 8%;
    text-align:center;
}

.contact input, .contact textarea{
    width:80%;
    max-width:400px;
    padding:10px;
    margin:8px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#111;
    color:white;
}
</style>
</head>

<body>

<header>
    <div class="logo">WoodnTech</div>
    <div class="cart-btn" onclick="toggleCart()">Cart (<span id="count">0</span>)</div>
</header>

<section class="hero">
    <h1>WoodnTech Store</h1>
    <p>Modern Home Essentials</p>
</section>

<section class="products">
    <h2>Products</h2>

    <div class="grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4">
            <div class="card-content">
                <h3>Wooden Lamp</h3>
                <button class="btn" onclick="addToCart('Wooden Lamp')">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85">
            <div class="card-content">
                <h3>Smart Shelf</h3>
                <button class="btn" onclick="addToCart('Smart Shelf')">Add to Cart</button>
            </div>
        </div>

    </div>
</section>

<!-- CART -->
<div class="cart" id="cart">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <button class="btn" onclick="checkout()">Checkout</button>
</div>

<!-- CONTACT (REAL EMAIL SERVICE) -->
<section class="contact">
    <h2>Contact Us</h2>

    <!-- Replace EMAIL BELOW -->
    <form action="https://formspree.io/f/mayplzxy" method="POST">
        <input type="text" name="name" placeholder="Your Name" required><br>
        <input type="email" name="email" placeholder="Your Email" required><br>
        <textarea name="message" placeholder="Message" required></textarea><br>
        <button class="btn" type="submit">Send Email</button>
    </form>
</section>

<footer>
    © 2026 WoodnTech
</footer>

<script>
let cart = [];

function addToCart(item){
    cart.push(item);
    updateCart();
}

function updateCart(){
    document.getElementById("count").innerText = cart.length;

    let html = "";
    cart.forEach((item,index)=>{
        html += `<div class="cart-item">
            ${item}
            <span class="remove" onclick="removeItem(${index})">X</span>
        </div>`;
    });

    document.getElementById("cartItems").innerHTML = html;
}

function removeItem(i){
    cart.splice(i,1);
    updateCart();
}

function toggleCart(){
    let c = document.getElementById("cart");
    c.style.display = c.style.display === "block" ? "none" : "block";
}

function checkout(){
    alert("Checkout system coming soon (next upgrade: payment integration)");
}
</script>

</body>
</html>
